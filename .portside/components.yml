        type: text
      eyebrow:
        type: text
      heading:
        type: text
      terms:
        type: list
        fields:
          heading:
            type: text
          body:
            type: markdown
  ArticleGrid:
    label: Article Grid
    fields:
      section_id:
        label: Section ID
        type: text
      eyebrow:
        type: text
      heading:
        type: text
