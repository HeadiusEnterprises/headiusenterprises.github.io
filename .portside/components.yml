        label: Secondary body
        type: markdown
      image:
        type: image
      image_alt:
        label: Image description
        type: text
  SupportPackagesSection:
    label: Support Packages
    children:
      accepts: [SupportPlan]
    fields:
      heading:
        type: text
      intro:
        type: markdown
  SupportPlan:
    label: Support Plan
    fields:
      name:
        type: text
      inheritance:
        type: text
      body:
        type: markdown
      features:
        type: markdown
      link_label:
        type: text
      link_url:
        type: url
      featured:
        type: boolean
      custom:
        type: boolean
  SplitSection:
