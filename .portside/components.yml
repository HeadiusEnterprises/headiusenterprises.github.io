components:
  HomeHero:
    label: Home Hero
    fields:
      require_path:
        label: Required library
        type: text
      heading:
        type: text
      subheading_prefix:
        label: Subheading
        type: text
      subheading_highlight:
        label: Highlighted subheading
        type: text
      body:
        type: markdown
      image:
        type: image
      image_alt:
        label: Image description
        type: text
      actions:
        type: list
        fields:
          label:
            type: text
          target:
            type: text
          style:
            type: select
            options: [primary, ghost]
  CustomerQuotesSection:
    label: Customer Quotes
    fields:
      interval:
        label: Rotation interval
        type: number
        default: 8000
      quotes:
        type: list
        fields:
          text:
            type: text
          name:
            type: text
          url:
            type: url
  HomeContact:
    label: Contact
    fields:
      section_id:
        label: Section ID
        type: text
        default: contact
      highlighted:
        type: boolean
      heading:
        type: text
      body:
        type: markdown
      details:
        type: list
        fields:
          label:
            type: text
          value:
            type: text
          url:
            type: url
  PageHero:
    label: Hero
    fields:
      eyebrow:
        label: Code heading
        type: text
      heading:
        type: text
      body:
        type: markdown
      image:
        type: image
      image_alt:
        label: Image description
        type: text
      actions:
        type: list
        fields:
          label:
            type: text
          url:
            type: url
          style:
            type: select
            options: [primary, ghost]
  PageGroup:
    label: Component Group
    children:
      accepts: [PageCard]
    fields:
      heading:
        type: text
      intro:
        type: markdown
      columns:
        type: number
        default: 2
      highlighted:
        type: boolean
  PageCard:
    label: Card
    content: body
    fields:
      title:
        type: text
      body:
        type: markdown
      image:
        type: image
      image_alt:
        label: Image description
        type: text
      link_label:
        type: text
      link_url:
        type: url
  PageVideoGallery:
    label: Video Gallery
    fields:
      section_id:
        label: Section ID
        type: text
      eyebrow:
        type: text
      heading:
        type: text
      intro:
        type: markdown
      highlighted:
        type: boolean
      videos:
        type: list
        fields:
          title:
            type: text
          video_url:
            label: Video link
            type: url
          embed_url:
            label: Embed link
            type: url
          background:
            label: Background image
            type: image
  PageIntro:
    label: Page Introduction
    fields:
      section_id:
        label: Section ID
        type: text
      require_path:
        label: Required library
        type: text
      heading:
        type: text
      body:
        type: markdown
  HomePitch:
    label: Home Pitch
